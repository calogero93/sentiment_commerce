# Configurazione di Prometheus: dove e ogni quanto raccogliere le metriche.

global:
  scrape_interval: 10s      # frequenza di raccolta
  evaluation_interval: 10s

scrape_configs:

  - job_name: sentiment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]